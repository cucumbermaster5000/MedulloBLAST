name: Live app health check
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: read
concurrency:
  group: live-app-health-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live application (retry once on failure)
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Attempt $attempt"
            if HEALTH_OUTPUT="health-results/attempt-$attempt" node healthcheck/check.cjs; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then sleep 30; fi
          done
          exit 1
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-health-diagnostics
          path: health-results/
          if-no-files-found: warn
          retention-days: 7
